});

// ===== CONFIG (change only this part) =====
const CFG={
 API:"",              // paste your Google Apps Script Web App URL here (ends with /exec)

const Q=[

["Celsius to Fahrenheit formula?","F = C × 9 ÷ 5 + 32","F = C + 32","F = C × 5 ÷ 9","F = C − 32"],

];
// ---------- mini Python checker (def, if/elif/else, input, print, variables, + - * / // % **, comparisons) ----------
class PE{constructor(t,m,l){this.t=t;this.m=m;this.l=l}}
class Ret{constructor(v){this.v=v}}
const cut=s=>{let q=null;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==="\\")i++;else if(c===q)q=null}else if(c==='"'||c==="'")q=c;else if(c==="#")return s.slice(0,i)}return s};
const tk=(s,n)=>{const re=/\s*(?:(\d+\.?\d*|\.\d+)|(f?)("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|([A-Za-z_]\w*)|(\/\/|\*\*|==|!=|<=|>=|[-+*\/%(),=<>:]))/y,T=[];while(!/^\s*$/.test(s.slice(re.lastIndex))){const m=re.exec(s);if(!m)throw new PE("SyntaxError","invalid syntax (check quotes, brackets or symbols)",n);T.push(m[1]!==undefined?{t:"n",v:+m[1]}:m[3]?{t:m[2]?"f":"s",v:m[3].slice(1,-1)}:m[4]?{t:"i",v:m[4]}:{t:"o",v:m[5]})}return T};
function runPy(src,inp){
 const out=[],V={True:true,False:false,__name__:"__main__"},F={};let k=0,steps=0;
 const fmt=v=>typeof v==="string"?v:v===true?"True":v===false?"False":v===null?"None":String(v);
 const bin=(o,a,b,n)=>{const sa=typeof a==="string",sb=typeof b==="string";
  if(o==="==")return a===b;if(o==="!=")return a!==b;
  if(["<",">","<=",">="].includes(o)){if(typeof a!==typeof b)throw new PE("TypeError","'"+o+"' not supported between str and number (convert input with int()/float())",n);return o==="<"?a<b:o===">"?a>b:o==="<="?a<=b:a>=b}
  if(o==="+"){if(sa&&sb)return a+b;if(sa||sb)throw new PE("TypeError",sa?'can only concatenate str (not "int") to str':"unsupported operand type(s) for +: 'int' and 'str'",n);return a+b}
  if(o==="*"){if(sa&&sb)throw new PE("TypeError","can't multiply sequence by non-int of type 'str'",n);if(sa)return a.repeat(Math.max(0,b));if(sb)return b.repeat(Math.max(0,a));return a*b}
  if(sa||sb)throw new PE("TypeError","unsupported operand type(s) for "+o+" (str and number mixed)",n);
  if((o==="/"||o==="//"||o==="%")&&b===0)throw new PE("ZeroDivisionError","division by zero",n);
  return o==="-"?a-b:o==="/"?a/b:o==="//"?Math.floor(a/b):o==="%"?a-b*Math.floor(a/b):a**b};
 const call=(f,a,n)=>{const x=a[0];
  if(f==="input"){if(k>=inp.length)throw new PE("EOFError","input() received no value",n);return String(inp[k++])}
  if(f==="int"||f==="float"){if(typeof x==="string"){if(!/^\s*[-+]?(\d+\.?\d*|\.\d+)\s*$/.test(x)||(f==="int"&&!/^\s*[-+]?\d+\s*$/.test(x)))throw new PE("ValueError","invalid literal for "+f+"()",n);return +x}return f==="int"?Math.trunc(x):x}
  if(f==="str")return fmt(x);
  if(f==="round"){const d=a[1]||0;return Math.round(x*10**d)/10**d}
  throw new PE("NameError","name '"+f+"' is not defined",n)};
 const callU=(f,a,n)=>{if(++steps>3000)throw new PE("RuntimeError","too many steps",n);f.params.forEach((p,i)=>V[p]=a[i]);try{execBlock(f.start,f.ind)}catch(e){if(e instanceof Ret)return e.v;throw e}return null};
 const mk=(T,n)=>{let p=0;
  const isO=v=>T[p]&&T[p].t==="o"&&T[p].v===v,isI=v=>T[p]&&T[p].t==="i"&&T[p].v===v;
  const need=v=>{if(!isO(v))throw new PE("SyntaxError",v===")"?"'(' was never closed":v===":"?"expected ':'":"invalid syntax",n);p++};
  const fs=s=>s.replace(/\{([^}]*)\}/g,(m,e)=>fmt(mk(tk(e,n),n).expr()));
  function expr(){let a=andx();while(isI("or")){p++;const b=andx();a=a||b}return a}
  function andx(){let a=notx();while(isI("and")){p++;const b=notx();a=a&&b}return a}
  function notx(){if(isI("not")){p++;return !notx()}return cmp()}
  function cmp(){let a=add();while(T[p]&&T[p].t==="o"&&["==","!=","<",">","<=",">="].includes(T[p].v)){const o=T[p++].v;a=bin(o,a,add(),n)}return a}
  function add(){let a=term();while(isO("+")||isO("-")){const o=T[p++].v;a=bin(o,a,term(),n)}return a}
  function term(){let a=un();while(isO("*")||isO("/")||isO("//")||isO("%")){const o=T[p++].v;a=bin(o,a,un(),n)}return a}
  function un(){if(isO("-")){p++;return bin("-",0,un(),n)}const a=atom();if(isO("**")){p++;return bin("**",a,un(),n)}return a}
  function args(){const a=[];while(T[p]&&!isO(")")){let kw=null;if(T[p].t==="i"&&T[p+1]&&T[p+1].t==="o"&&T[p+1].v==="="){kw=T[p].v;p+=2}const v=expr();a.push(kw?{kw,v}:v);if(isO(","))p++;else break}return a}
  function atom(){const t=T[p++];if(!t)throw new PE("SyntaxError","line is incomplete",n);
   if(t.t==="n"||t.t==="s")return t.v;if(t.t==="f")return fs(t.v);
   if(t.t==="i"){if(isO("(")){p++;const a=args();need(")");return F[t.v]?callU(F[t.v],a.filter(x=>!(x&&x.kw)),n):call(t.v,a,n)}if(!(t.v in V))throw new PE("NameError","name '"+t.v+"' is not defined",n);return V[t.v]}
   if(t.v==="("){const v=expr();need(")");return v}throw new PE("SyntaxError","invalid syntax",n)}
  return{expr,args,need,get p(){return p},set p(v){p=v}}};
 const L=[];src.replace(/\r/g,"").replace(/\t/g,"    ").split("\n").forEach((raw,i)=>{const s=cut(raw);if(!s.trim())return;L.push({n:i+1,ind:s.match(/^ */)[0].length,T:tk(s.trim(),i+1)})});
 const bodyInd=i=>{const nx=L[i+1];if(!nx||nx.ind<=L[i].ind)throw new PE("IndentationError","expected an indented block",L[i].n);return nx.ind};
 const skip=i=>{const ind=L[i].ind;let j=i+1;while(j<L.length&&L[j].ind>ind)j++;return j};
 function execBlock(i,ind){while(i<L.length&&L[i].ind>=ind){if(L[i].ind>ind)throw new PE("IndentationError","unexpected indent",L[i].n);i=stmt(i)}return i}
 function stmt(i){const l=L[i],T=l.T,h=T[0],n=l.n;
  if(++steps>5000)throw new PE("RuntimeError","too many steps",n);
  if(h.t==="i"&&/^(while|for|try|import|from|class|with|lambda)$/.test(h.v))throw new PE("Unsupported","'"+h.v+"' is not supported in this test (use def/if/elif/else/input/print)",n);
  if(h.t==="i"&&(h.v==="elif"||h.v==="else"))throw new PE("SyntaxError","invalid syntax ("+h.v+" without if)",n);
  const endChk=m=>{if(m.p<T.length)throw new PE("SyntaxError","invalid syntax",n)};
  if(h.t==="i"&&h.v==="def"){if(!(T[1]&&T[1].t==="i"&&T[2]&&T[2].v==="("))throw new PE("SyntaxError","invalid syntax",n);let q=3;const ps=[];while(T[q]&&T[q].v!==")"){if(T[q].t==="i")ps.push(T[q].v);q++}
   if(!T[q])throw new PE("SyntaxError","'(' was never closed",n);if(!T[q+1]||T[q+1].v!==":")throw new PE("SyntaxError","expected ':'",n);F[T[1].v]={params:ps,start:i+1,ind:bodyInd(i)};return skip(i)}
  if(h.t==="i"&&h.v==="if"){let j=i,done=false;const ind=l.ind;
   while(true){const lj=L[j],tj=lj.T,isE=tj[0].v==="else";let c=true;
    if(isE){if(!(tj[1]&&tj[1].v===":"))throw new PE("SyntaxError","expected ':'",lj.n)}
    else{if(!done){const m=mk(tj,lj.n);m.p=1;c=m.expr();m.need(":");if(m.p<tj.length)throw new PE("SyntaxError","invalid syntax",lj.n)}else c=false}
    const bi=bodyInd(j),end=skip(j);if(!done&&c){execBlock(j+1,bi);done=true}
    j=end;if(!isE&&j<L.length&&L[j].ind===ind&&L[j].T[0].t==="i"&&(L[j].T[0].v==="elif"||L[j].T[0].v==="else"))continue;return j}}
  const m=mk(T,n);
  if(h.t==="i"&&h.v==="return"){m.p=1;const v=T.length>1?m.expr():null;throw new Ret(v)}
  if(h.t==="i"&&h.v==="print"&&T[1]&&T[1].v==="("){m.p=2;const a=m.args();m.need(")");endChk(m);const pos=a.filter(x=>!(x&&x.kw)),sep=a.find(x=>x&&x.kw==="sep");out.push(pos.map(fmt).join(sep?fmt(sep.v):" "));return i+1}
  if(h.t==="i"&&T[1]&&T[1].t==="o"&&T[1].v==="="){m.p=2;V[h.v]=m.expr();endChk(m);return i+1}
  m.expr();endChk(m);return i+1}
 if(L.length)execBlock(0,0);
 return out}
function grade(src){
 const clean=src.split("\n").map(cut).join("\n");
 if(!clean.trim())return{score:0,checks:[{ok:false,p:0,m:10,msg:"Code is empty."}]};
 const runs=[[1,15,4],[2,15,4],[3,15,4],[4,15,4],[1,25,8],[2,25,8],[3,25,8],[4,25,8],[4,5,0],[9,5,3]],exp=[[19,11,60,3.75],[33,17,200,3.125]];
 const R=runs.map(r=>{try{return{o:runPy(src,r)}}catch(e){if(!(e instanceof PE))throw e;return{e}}});
 const E=e=>`${e.t} (line ${e.l}): ${e.m}`,isSyn=e=>e&&/Syntax|Indent|Unsupp/.test(e.t);
 const syn=(R.find(r=>isSyn(r.e))||{}).e,rt=(R.slice(0,8).find(r=>r.e&&!isSyn(r.e))||{}).e;
 const nums=o=>(o.join(" ").match(/-?\d+\.?\d*/g)||[]).map(Number),has=(r,v)=>r.o&&nums(r.o).some(x=>Math.abs(x-v)<1e-6);
 const C=[],add=(ok,pt,_,msg)=>C.push({ok,p:ok?pt:0,m:pt,msg});
 add(!syn,1,0,syn?"Syntax error → "+E(syn):"Syntax is correct");
 add(!syn&&!rt,1,0,syn?"Did not run because of the syntax error":rt?"Error while running → "+E(rt)+(rt.t==="TypeError"?" (input() returns a string; convert it with int()/float())":""):"Runs without errors");
 const hasDef=/\bdef\s+\w+\s*\(/.test(clean),called=!!(R[0].o&&R[0].o.length);
 add(hasDef&&called,1,0,!hasDef?"No function created with def":!called?"Function was defined but never called (call calculator() at the end)":"Function defined and called");
 const conv=!syn&&!rt&&/\b(int|float)\s*\(/.test(clean);
 add(conv,1,0,conv?"Converted input with int()/float()":"Input was not converted with int()/float()");
 const ife=/\bif\b/.test(clean)&&/\belse\b/.test(clean);
 add(ife,0.5,0,ife?"Used if/elif/else":"if/elif/else not used");
 ["Add (1)","Subtract (2)","Multiply (3)","Divide (4)"].forEach((nm,j)=>{const ok=has(R[j],exp[0][j])&&has(R[j+4],exp[1][j]);
  add(ok,1,0,ok?nm+" correct":nm+" is wrong or not printed (for 15 and 4 it should show "+exp[0][j]+")")});
 const z=R[8],zok=!!(z.o&&/zero|error|undefined|cannot|invalid|not allowed/i.test(z.o.join(" ")));
 add(zok,1,0,zok?"Division by zero handled":z.e?"Crashed on division by zero → "+E(z.e):"No error message printed for division by zero");
 const v=R[9],vok=!!(v.o&&/invalid|wrong|error|incorrect/i.test(v.o.join(" ")));
 add(vok,0.5,0,vok?"Invalid operation handled":"Invalid choice (e.g. 9) did not print 'Invalid operation!'");
 return{score:C.reduce((a,c)=>a+c.p,0),checks:C}}

// ---------- app ----------
const $=id=>document.getElementById(id),app=$("app"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jp=(s,d)=>{try{const v=JSON.parse(s);return v==null?d:v}catch(e){return d}};
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const ss={g:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}}};
const r1=n=>Math.round(n*10)/10,MAX=CFG.MAX,NQ=Math.min(CFG.NQ,Q.length);
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const tmo=(p,ms)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),ms))]);
let st=Object.assign({name:"",dev:rid(),attempts:0,best:null,locked:false,viol:0,active:false},jp(ls.g("zq4"),{}));
const save=()=>ls.s("zq4",JSON.stringify(st));save();
let IP="unknown",cur=null,msg="",net=CFG.API?"checking":"offline",busy=false,timer=null;
const ipP=tmo(fetch("https://api.ipify.org?format=json").then(r=>r.json()),3500).then(j=>{IP=j.ip}).catch(()=>{});
const lastR=()=>jp(ls.g("zl4"),null);
const badge=()=>!CFG.API?"🟡 Offline mode — results are NOT sent to your teacher":net==="ok"?"🟢 Connected":net==="checking"?"⏳ Connecting…":"🔴 Cannot reach the server — check your internet";
// ----- server calls -----
async function api(d,ms){
 if(!CFG.API)return{ok:true,local:true};
 await ipP;
 try{
  const r=await tmo(fetch(CFG.API,{method:"POST",body:JSON.stringify({name:st.name,dev:st.dev,ip:IP,ua:navigator.userAgent.slice(0,90),...d})}).then(x=>x.text()),ms||15000);
  const j=jp(r,null);if(!j){net="bad";return null}
  net="ok";return j}
 catch(e){net="down";return null}}
const getQ=()=>jp(ls.g("zqq"),[]),setQ=q=>ls.s("zqq",JSON.stringify(q));
async function send(d){d.eid=rid();d.name=st.name;d.dev=st.dev;const r=await api(d);if(CFG.API&&!(r&&r.ok)){const q=getQ();q.push(d);setQ(q)}return r}
async function flush(){if(!CFG.API)return;const q=getQ();if(!q.length)return;const rest=[];for(const d of q){const r=await api(d);if(!(r&&r.ok))rest.push(d)}setQ(rest)}
async function sync(){const s=await api({event:"status"});
 if(s&&s.ok&&!s.local){st.attempts=s.attempts;st.best=s.best;st.viol=s.cheats;st.locked=s.attempts>=MAX;if(s.last)ls.s("zl4",s.last);save()}}
// ----- screens -----
function home(){
 const done=st.locked||st.attempts>=MAX,L=lastR();
 const nameBox=CFG.ROSTER.length?`<select id="nm"><option value="">— Select your name —</option>${CFG.ROSTER.map(n=>`<option>${esc(n)}</option>`).join("")}</select>`:'<input id="nm" placeholder="Your full name" autocomplete="name">';
 const rules=`<div class="c"><b>Rules</b><ul class="tiny"><li>${NQ} multiple-choice questions + 1 Python calculator task (20 marks total).</li><li>You get ${MAX} attempts. Each attempt uses new random questions.</li>${CFG.TIME_LIMIT_MIN?`<li>Time limit: ${CFG.TIME_LIMIT_MIN} minutes per attempt.</li>`:""}<li>If you leave this screen, switch apps or reload during a test, that attempt is cancelled.</li><li>Code must be typed. Paste, copy and drag-drop are blocked.</li><li>Your IP address and device are recorded.</li></ul></div>`;
 app.innerHTML=msg+(st.name?`<div class="c"><b>Welcome back, ${esc(st.name)}! 👋</b><p class="tiny">Attempts used: ${st.attempts}/${MAX}${st.best!=null?" · Best score: "+st.best+"/20":""}</p>${done?'<p class="bad">You have used all your attempts.</p>':'<button class="p" id="go">Start test</button>'}${L?'<button id="rp">View my last result and mistakes</button>':""}</div>`
 :`<div class="c"><p>Enter your name (only once):</p>${nameBox}<p class="bad tiny" id="er"></p><button class="p" id="go">Save and continue</button></div>`)
 +rules+`<p class="tiny" id="bd">${badge()}</p>`;
 const g=$("go");if(g)g.onclick=async()=>{
  if(!st.name){const n=$("nm").value.trim().replace(/\s+/g," ");if(n.length<2){$("er").textContent="Please enter your name.";return}
   g.disabled=true;g.textContent="Loading…";msg="";st.name=n;save();await sync();home()}
  else{g.disabled=true;g.textContent="Starting…";start()}};
 const r=$("rp");if(r)r.onclick=()=>report(L)}
async function start(){
 if(busy)return;busy=true;msg="";
 try{
  if(!CFG.API&&st.attempts>=MAX)return home();
  await flush();
  const r=await api({event:"start"});
  if(!r){msg='<div class="c bad">Could not reach the server. Check your internet and try again. (No attempt was used.)</div>';return home()}
  if(!r.ok){if(r.attempts!=null)st.attempts=r.attempts;st.locked=true;save();msg='<div class="c bad">You have used all your attempts.</div>';return home()}
  st.attempts=r.local?st.attempts+1:r.attempts;st.active=true;st.locked=false;save();
  const qs=shuf(Q).slice(0,NQ).map(q=>({q:q[0],r:q[1],o:shuf(q.slice(1).map((t,i)=>[t,i===0]))}));
  cur={qs,i:0,sc:0,wrong:[],on:true,ph:"mcq",t0:Date.now(),dl:CFG.TIME_LIMIT_MIN?Date.now()+CFG.TIME_LIMIT_MIN*6e4:0};
  clearInterval(timer);timer=setInterval(tick,1000);showQ();
 }finally{busy=false}}
function tick(){if(!cur||!cur.on){clearInterval(timer);return}
 if(!cur.dl)return;const left=Math.max(0,cur.dl-Date.now()),el=$("tm");
 if(el)el.textContent="⏱ "+Math.floor(left/6e4)+":"+String(Math.floor(left%6e4/1000)).padStart(2,"0");
 if(left<=0)timeUp()}
function timeUp(){if(!cur||!cur.on)return;let code="";
 if(cur.ph==="mcq"){for(let k=cur.i;k<NQ;k++)cur.wrong.push({q:cur.qs[k].q,you:"(no answer — time up)",right:cur.qs[k].r})}
 else{const ta=$("ta");code=ta?ta.value:""}
 submit(code,true)}
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
function showQ(){const x=cur.qs[cur.i];let used=false;
 app.innerHTML=`<div class="c">${bar(cur.i/NQ*100)}<div class="row"><span class="tiny">Part A · Question ${cur.i+1} of ${NQ} · Attempt ${st.attempts}/${MAX}</span><span class="tiny" id="tm"></span></div><p id="qt" style="white-space:pre-wrap"></p>${x.o.map((o,k)=>`<button data-k="${k}"></button>`).join("")}</div>`;
 requestAnimationFrame(()=>{const i=document.querySelector(".bar i");if(i)i.style.width=((cur.i+1)/NQ*100)+"%"});
 $("qt").textContent=x.q;tick();
 app.querySelectorAll("button").forEach(b=>{const o=x.o[b.dataset.k];b.textContent=o[0];
  b.onclick=()=>{if(used||!cur||!cur.on)return;used=true;if(o[1])cur.sc++;else cur.wrong.push({q:x.q,you:o[0],right:x.r});cur.i++;if(cur.i>=NQ)showCode();else showQ()}})}
function showCode(){cur.ph="code";
 app.innerHTML=`<div class="c">${bar(100)}<div class="row"><span class="tiny">Part B · Calculator (10 marks)</span><span class="tiny" id="tm"></span></div><p>Write a <b>calculator()</b> function in Python:</p><ul><li>Print a menu: 1 Add, 2 Subtract, 3 Multiply, 4 Divide.</li><li>Read the operation with <b>int(input())</b>.</li><li>Read two numbers with <b>float(input())</b>.</li><li>Use <b>if / elif / else</b> and print <i>Result: ...</i></li><li>For divide, if the second number is 0 print an error message.</li><li>For any other choice print <i>Invalid operation!</i></li><li>Call <b>calculator()</b> at the end.</li></ul><p class="tiny">Type your code. Paste is disabled. Use the buttons for symbols.</p><div id="tb"></div><textarea id="ta" rows="13" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" data-gramm="false"></textarea><p class="bad tiny" id="cw"></p><button class="p" id="sub">Submit</button></div>`;
 tick();const ta=$("ta");let prev="",warned=false;
 ["(",")",'"',"'",":","=","==","+","-","*","/",",","#","    "].forEach(ch=>{const b=document.createElement("button");b.className="k";b.textContent=ch.trim()?ch:"⇥ tab";b.onmousedown=e=>e.preventDefault();b.onclick=()=>{ta.focus();ta.setRangeText(ch,ta.selectionStart,ta.selectionEnd,"end");prev=ta.value};$("tb").appendChild(b)});
 ["paste","drop","cut","copy","contextmenu","dragstart"].forEach(ev=>ta.addEventListener(ev,e=>e.preventDefault()));
 ta.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&/^[vxcy]$/i.test(e.key)||(e.shiftKey&&e.key==="Insert"))e.preventDefault();
  if(e.key==="Tab"){e.preventDefault();ta.setRangeText("    ",ta.selectionStart,ta.selectionEnd,"end");prev=ta.value}});
 ta.addEventListener("beforeinput",e=>{if(/Paste|Drop|Yank/.test(e.inputType)||(e.data&&e.data.length>30))e.preventDefault()});
 ta.addEventListener("input",()=>{if(ta.value.length-prev.length>30){ta.value=prev}prev=ta.value});
 $("sub").onclick=()=>{if(ta.value.trim().length<5&&!warned){warned=true;$("cw").textContent="Your code looks empty. Tap Submit again to confirm.";return}submit(ta.value)}}
function submit(code,auto){
 if(!cur||!cur.on)return;cur.on=false;clearInterval(timer);st.active=false;
 const g=grade(code),mcq=cur.sc,total=r1(mcq+g.score);
 if(st.best==null||total>st.best)st.best=total;if(st.attempts>=MAX)st.locked=true;save();
 const r={name:st.name,mcq,code:r1(g.score),total,wrong:cur.wrong,checks:g.checks,code_text:code.slice(0,1500),secs:Math.round((Date.now()-cur.t0)/1000),auto:!!auto};
 ls.s("zl4",JSON.stringify(r));report(r,true);
 send({event:"result",mcq:r.mcq,code:r.code,total,data:r}).then(x=>{const e=$("ss");if(e)e.innerHTML=!CFG.API?"🟡 Offline mode: result was not sent":x&&x.ok?"✅ Result sent to your teacher":"⚠️ Could not send yet. It will be re-sent automatically next time you open this page with internet."})}
function detail(r){return `<p><b>MCQ ${r.mcq}/10 · Code ${r.code}/10</b>${r.secs?` · time ${Math.floor(r.secs/60)}m ${r.secs%60}s`:""}${r.auto?" · auto-submitted (time up)":""}</p>`
 +(r.wrong&&r.wrong.length?"<p><b>Wrong MCQs:</b></p>"+r.wrong.map(w=>`<div class="c"><div style="white-space:pre-wrap">${esc(w.q)}</div><div class="bad">Your answer: ${esc(w.you)}</div><div class="ok">Correct: ${esc(w.right)}</div></div>`).join(""):'<p class="ok">All MCQs correct ✅</p>')
 +"<p><b>Calculator check:</b></p>"+(r.checks||[]).map(c=>`<div class="${c.ok?"ok":"bad"}">${c.ok?"✅":"❌"} ${esc(c.msg)} (${c.p}/${c.m})</div>`).join("")+(r.code_text?`<p class="tiny">Submitted code:</p><pre>${esc(r.code_text)}</pre>`:"")}
function report(r,anim){app.innerHTML=`<div class="c"><h3>Score: <span id="sc">${anim?0:r.total}</span>/20</h3><p class="tiny" id="ss">${anim?"Sending result…":""}</p>${detail(r)}<button class="p" id="hm">Back</button></div>`;
 $("hm").onclick=home;
 if(anim){const t0=performance.now(),el=$("sc");(function f(t){const k=Math.min(1,(t-t0)/900);el.textContent=r1(r.total*k);if(k<1)requestAnimationFrame(f)})(t0);
  if(r.total>=15)for(let i=0;i<36;i++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","✨","⭐"][i%3];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),3500)}}}
function violate(why){if(!cur||!cur.on)return;cur.on=false;clearInterval(timer);st.active=false;st.viol++;if(st.attempts>=MAX)st.locked=true;save();
 send({event:"cheat",total:0,cheat:1,data:{why:why||"left the screen"}});
 app.innerHTML=`<div class="c"><h3 class="bad">Test cancelled ❌</h3><p>You left the test screen, so this attempt was cancelled. Attempts used: ${st.attempts}/${MAX}.</p>${st.attempts<MAX?'<button class="p" id="rs">Start again with new random questions</button>':"<p>You have no attempts left.</p>"}<button id="hm">Home</button></div>`;
 const r=$("rs");if(r)r.onclick=start;$("hm").onclick=home}
document.addEventListener("visibilitychange",()=>{if(document.hidden)violate("switched app/tab")});
window.addEventListener("blur",()=>{if(!cur||!cur.on)return;setTimeout(()=>{if(cur&&cur.on&&(document.hidden||!document.hasFocus()))violate("window lost focus")},400)});
// ----- teacher report (#admin) -----
function adminUI(){
 app.innerHTML='<div class="c"><b>👑 Teacher report</b><p class="tiny">Enter the admin KEY you set in Code.gs.</p><input id="ak" type="password" placeholder="Admin key"><button class="p" id="ab">Open report</button><p class="bad tiny" id="ae"></p></div><div id="rp"></div>';
 async function load(){const k=$("ak").value.trim();if(!k)return;$("ab").disabled=true;$("ab").textContent="Loading…";$("ae").textContent="";
  try{if(!CFG.API)throw new Error("CFG.API is empty in index.html");
   const t=await tmo(fetch(CFG.API+"?key="+encodeURIComponent(k)).then(x=>x.text()),20000),j=jp(t,null);
   if(!j)throw new Error("Server did not return data. Deploy the web app with access = Anyone and use the URL that ends with /exec.");
   if(!j.ok)throw new Error("Wrong admin key.");
   ss.s("zk",k);drawAdmin(j.rows.slice(1))}
  catch(e){$("ae").textContent=e.message==="timeout"?"Timed out. Try again.":e.message}
  $("ab").disabled=false;$("ab").textContent="Refresh report"}
 $("ab").onclick=load;const k0=ss.g("zk");if(k0){$("ak").value=k0;load()}}
function drawAdmin(rows){
 const S={},ipn={},qm={},cm={};
 rows.forEach(r=>{const key=String(r[1]).trim().toLowerCase();if(!key)return;
  const o=S[key]=S[key]||{name:r[1],starts:0,cheats:0,best:null,ips:new Set,devs:new Set,res:[]};
  o.ips.add(r[3]);o.devs.add(r[2]);(ipn[r[3]]=ipn[r[3]]||new Set).add(key);
  if(r[4]==="start")o.starts++;if(r[4]==="cheat")o.cheats++;
  if(r[4]==="result"){const t=+r[8],d=jp(r[10],null);o.res.push({t,d,time:r[0]});if(o.best===null||t>o.best)o.best=t;
   if(d){(d.wrong||[]).forEach(w=>{qm[w.q]=(qm[w.q]||0)+1});(d.checks||[]).forEach(c=>{if(!c.ok)cm[c.msg]=(cm[c.msg]||0)+1})}}});
 const L=Object.values(S).sort((a,b)=>(b.best??-1)-(a.best??-1)),sub=L.filter(o=>o.best!==null);
 const avg=sub.length?r1(sub.reduce((a,o)=>a+o.best,0)/sub.length):"-";
 const top=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n),mx=a=>a.length?a[0][1]:1;
 const tq=top(qm,8),tc=top(cm,6);
 const seen=new Set(L.map(o=>o.name.toLowerCase())),missing=CFG.ROSTER.filter(n=>!seen.has(n.toLowerCase()));
 const bars=a=>a.map(([k,v])=>`<div class="tiny" style="white-space:pre-wrap">${esc(k)} <b>×${v}</b></div><div class="bar"><i style="width:${v/mx(a)*100}%"></i></div>`).join("")||'<p class="tiny">No data yet.</p>';
 const status=o=>o.best!==null?"Submitted":o.starts?"Started, not submitted":"—";
 $("rp").innerHTML=`<div class="c"><b>Summary</b><div class="grid"><div class="stat"><b>${L.length}</b><span>students started</span></div><div class="stat"><b>${sub.length}</b><span>submitted</span></div><div class="stat"><b>${avg}</b><span>average best /20</span></div><div class="stat"><b>${L.reduce((a,o)=>a+o.cheats,0)}</b><span>cheat flags</span></div></div>${missing.length?`<p class="bad tiny">Not started yet (${missing.length}): ${esc(missing.join(", "))}</p>`:""}</div>
 <div class="c"><b>Ranking</b><table><tr><th>#</th><th>Name</th><th>Best</th><th>Tries</th><th>Cheat</th></tr>${L.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.name)}</td><td>${o.best??"-"}</td><td>${o.starts}</td><td>${o.cheats}</td></tr>`).join("")}</table><button id="csv">⬇ Download CSV</button></div>
 <div class="c"><b>Most missed questions</b>${bars(tq)}</div><div class="c"><b>Most common calculator mistakes</b>${bars(tc)}</div>
 <p><b>Student reports</b> (tap a name)</p>`
 +L.map(o=>{const sh=[...o.ips].filter(ip=>ipn[ip].size>1).map(ip=>ip+" ("+[...ipn[ip]].join(", ")+")");
  return `<details class="c"><summary>${esc(o.name)} — ${o.best??"-"}/20 · ${status(o)}</summary><p class="tiny">IP: ${[...o.ips].map(esc).join(", ")} · devices: ${o.devs.size}${o.devs.size>1?" ⚠️":""} · cheat flags: ${o.cheats}${sh.length?"<br>⚠️ Shared IP with: "+esc(sh.join("; ")):""}</p>${o.res.length?o.res.map((x,i)=>`<p><b>Attempt result ${i+1}</b> — ${x.t}/20</p>${x.d?detail(x.d):""}`).join(""):"<p>No result submitted.</p>"}</details>`}).join("");
 $("csv").onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const c=["name,best,attempts_started,cheats,ips,devices,last_mcq,last_code"].concat(L.map(o=>{const l=o.res.length?o.res[o.res.length-1].d||{}:{};return[o.name,o.best,o.starts,o.cheats,[...o.ips].join(" "),o.devs.size,l.mcq,l.code].map(q).join(",")})).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="results.csv";a.click()}}
// ----- start -----
if(location.hash==="#admin")adminUI();
else{
 if(st.active){st.active=false;st.viol++;save();msg='<div class="c bad">⚠️ The page was closed or reloaded during your test, so that attempt was cancelled.</div>';if(st.name)send({event:"cheat",total:0,cheat:1,data:{why:"reloaded/closed during test"}})}
 home();
 (async()=>{if(CFG.API){await flush();if(st.name)await sync();else await api({event:"ping"})}
  if(cur||busy)return;if(st.name)home();else{const b=$("bd");if(b)b.textContent=badge()}})()}
</script></body></html>
