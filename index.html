<script>
// ===== CONFIG (sirf yahan badlo) =====
const CFG={
 API:"",            // Apps Script Web App URL yahan paste karo
 MAX:2,             // kitne attempts
 NQ:10,             // kitne MCQ har bande ko

};
const Q=[
["A program is...","A set of instructions for a computer","A type of hardware","A bug","A keyboard"],
["Every program follows which pattern?","Input → Process → Output","Output → Input → Process","Save → Delete → Run","Read → Write → Stop"],

["Python 2 reached end of life in...","2020","2005","2030","1991"],

["The REPL is...","Interactive mode with the >>> prompt","A file type","An editor","A kind of bug"],
["How do you run a script file?","python hello.py","run hello.py","hello.py python","start python.hello"],
["'python is not recognized' on Windows usually means...","Python was not added to PATH","Wrong editor","No internet","A syntax error"],
["Comment symbol in Python?","#","//","/* */","--"],
["print('Python','is','fun',sep='-') shows...","Python-is-fun","Python is fun","Python,is,fun","Python-is-fun-"],
["input() always returns...","A string (str)","An int","A float","A bool"],
["age = input('Age: ')  # user types 20\nprint(age + 1)  gives...","TypeError","21","201","20"],
["print(17 // 5)","3","3.4","4","2"],
["print(17 % 5)","2","3","3.4","12"],
["print('ab' * 3)","ababab","ab3","aaabbb","Error"],
["print(len('Python'))","6","5","7","Error"],
["type(3.14) gives...","<class 'float'>","<class 'int'>","<class 'str'>","<class 'bool'>"],
["Which is a valid variable name?","first_name","2age","first name","class"],
["average = 10 + 20 / 2\nprint(average)  shows...","20.0","15.0","30","10"],
["Which error does Python never report by itself?","Logic error","Syntax error","Runtime error","NameError"],
["name='Ali'\nprint(nmae)  gives...","NameError","SyntaxError","ValueError","No error"],
["print('Hello'  (bracket not closed) gives...","SyntaxError","NameError","TypeError","Logic error"],
["print('Loading', end='...')\nprint('done')  shows...","Loading...done","Loading\ndone","Loading done","done"],
["Python naming convention for variables?","snake_case","camelCase only","UPPER only","No rule"],
["PEP 8 says indent with...","4 spaces","1 space","10 spaces","No indent"],
["Celsius to Fahrenheit formula?","F = C × 9 ÷ 5 + 32","F = C + 32","F = C × 5 ÷ 9","F = C − 32"],
["When should you decide expected test answers?","Before running the program","After running it","Never","Only if it fails"]
];
// ---------- mini Python checker ----------
class PE{constructor(t,m,l){this.t=t;this.m=m;this.l=l}}
class Ret{constructor(v){this.v=v}}
const cut=s=>{let q=null;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==="\\")i++;else if(c===q)q=null}else if(c==='"'||c==="'")q=c;else if(c==="#")return s.slice(0,i)}return s};
const tk=(s,n)=>{const re=/\s*(?:(\d+\.?\d*|\.\d+)|(f?)("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|([A-Za-z_]\w*)|(\/\/|\*\*|==|!=|<=|>=|[-+*\/%(),=<>:]))/y,T=[];while(!/^\s*$/.test(s.slice(re.lastIndex))){const m=re.exec(s);if(!m)throw new PE("SyntaxError","invalid syntax (quote/bracket ya symbol check karo)",n);T.push(m[1]!==undefined?{t:"n",v:+m[1]}:m[3]?{t:m[2]?"f":"s",v:m[3].slice(1,-1)}:m[4]?{t:"i",v:m[4]}:{t:"o",v:m[5]})}return T};
function runPy(src,inp){
 const out=[],V={True:true,False:false,__name__:"__main__"},F={};let k=0,steps=0;
 const fmt=v=>typeof v==="string"?v:v===true?"True":v===false?"False":v===null?"None":String(v);
 const bin=(o,a,b,n)=>{const sa=typeof a==="string",sb=typeof b==="string";
  if(o==="==")return a===b;if(o==="!=")return a!==b;
  if(["<",">","<=",">="].includes(o)){if(typeof a!==typeof b)throw new PE("TypeError","'"+o+"' str aur number ke beech nahi chal sakta (input ko int()/float() karo)",n);return o==="<"?a<b:o===">"?a>b:o==="<="?a<=b:a>=b}
  if(o==="+"){if(sa&&sb)return a+b;if(sa||sb)throw new PE("TypeError",sa?'can only concatenate str (not "int") to str':"unsupported operand type(s) for +: 'int' and 'str'",n);return a+b}
  if(o==="*"){if(sa&&sb)throw new PE("TypeError","can't multiply sequence by non-int of type 'str'",n);if(sa)return a.repeat(Math.max(0,b));if(sb)return b.repeat(Math.max(0,a));return a*b}
  if(sa||sb)throw new PE("TypeError","unsupported operand type(s) for "+o+" (str aur number mix)",n);
  if((o==="/"||o==="//"||o==="%")&&b===0)throw new PE("ZeroDivisionError","division by zero",n);
  return o==="-"?a-b:o==="/"?a/b:o==="//"?Math.floor(a/b):o==="%"?a-b*Math.floor(a/b):a**b};
 const call=(f,a,n)=>{const x=a[0];
  if(f==="input"){if(k>=inp.length)throw new PE("EOFError","input() ko value nahi mili",n);return String(inp[k++])}
  if(f==="int"||f==="float"){if(typeof x==="string"){if(!/^\s*[-+]?(\d+\.?\d*|\.\d+)\s*$/.test(x)||(f==="int"&&!/^\s*[-+]?\d+\s*$/.test(x)))throw new PE("ValueError","invalid literal for "+f+"()",n);return +x}return f==="int"?Math.trunc(x):x}
  if(f==="str")return fmt(x);
  if(f==="round"){const d=a[1]||0;return Math.round(x*10**d)/10**d}
  throw new PE("NameError","name '"+f+"' is not defined",n)};
 const callU=(f,a,n)=>{if(++steps>3000)throw new PE("RuntimeError","bahut zyada steps",n);f.params.forEach((p,i)=>V[p]=a[i]);try{execBlock(f.start,f.ind)}catch(e){if(e instanceof Ret)return e.v;throw e}return null};
 const mk=(T,n)=>{let p=0;
  const isO=v=>T[p]&&T[p].t==="o"&&T[p].v===v,isI=v=>T[p]&&T[p].t==="i"&&T[p].v===v;
  const need=v=>{if(!isO(v))throw new PE("SyntaxError",v===")"?"'(' was never closed":v===":"?"expected ':'":"invalid syntax",n);p++};
  const fs=s=>s.replace(/\{([^}]*)\}/g,(m,e)=>fmt(mk(tk(e,n),n).expr()));
  function expr(){let a=andx();while(isI("or")){p++;const b=andx();a=a||b}return a}
  function andx(){let a=notx();while(isI("and")){p++;const b=notx();a=a&&b}return a}
  function notx(){if(isI("not")){p++;return !notx()}return cmp()}
  function cmp(){let a=add();while(T[p]&&T[p].t==="o"&&["==","!=","<",">","<=",">="].includes(T[p].v)){const o=T[p++].v;a=bin(o,a,add(),n)}return a}
  function add(){let a=term();while(isO("+")||isO("-")){const o=T[p++].v;a=bin(o,a,term(),n)}return a}
  function term(){let a=un();while(isO("*")||isO("/")||isO("//")||isO("%")){const o=T[p++].v;a=bin(o,a,un(),n)}return a}
  function un(){if(isO("-")){p++;return bin("-",0,un(),n)}const a=atom();if(isO("**")){p++;return bin("**",a,un(),n)}return a}
  function args(){const a=[];while(T[p]&&!isO(")")){let kw=null;if(T[p].t==="i"&&T[p+1]&&T[p+1].t==="o"&&T[p+1].v==="="){kw=T[p].v;p+=2}const v=expr();a.push(kw?{kw,v}:v);if(isO(","))p++;else break}return a}
  function atom(){const t=T[p++];if(!t)throw new PE("SyntaxError","line adhoori hai",n);
   if(t.t==="n"||t.t==="s")return t.v;if(t.t==="f")return fs(t.v);
   if(t.t==="i"){if(isO("(")){p++;const a=args();need(")");return F[t.v]?callU(F[t.v],a.filter(x=>!(x&&x.kw)),n):call(t.v,a,n)}if(!(t.v in V))throw new PE("NameError","name '"+t.v+"' is not defined",n);return V[t.v]}
   if(t.v==="("){const v=expr();need(")");return v}throw new PE("SyntaxError","invalid syntax",n)}
  return{expr,args,need,get p(){return p},set p(v){p=v}}};
 const L=[];src.replace(/\r/g,"").replace(/\t/g,"    ").split("\n").forEach((raw,i)=>{const s=cut(raw);if(!s.trim())return;L.push({n:i+1,ind:s.match(/^ */)[0].length,T:tk(s.trim(),i+1)})});
 const bodyInd=i=>{const nx=L[i+1];if(!nx||nx.ind<=L[i].ind)throw new PE("IndentationError","expected an indented block",L[i].n);return nx.ind};
 const skip=i=>{const ind=L[i].ind;let j=i+1;while(j<L.length&&L[j].ind>ind)j++;return j};
 function execBlock(i,ind){while(i<L.length&&L[i].ind>=ind){if(L[i].ind>ind)throw new PE("IndentationError","unexpected indent",L[i].n);i=stmt(i)}return i}
 function stmt(i){const l=L[i],T=l.T,h=T[0],n=l.n;
  if(++steps>5000)throw new PE("RuntimeError","bahut zyada steps",n);
  if(h.t==="i"&&/^(while|for|try|import|from|class|with|lambda)$/.test(h.v))throw new PE("Unsupported","'"+h.v+"' is test mein supported nahi (def/if/elif/else/input/print use karo)",n);
  if(h.t==="i"&&(h.v==="elif"||h.v==="else"))throw new PE("SyntaxError","invalid syntax ("+h.v+" bina if ke)",n);
  const endChk=m=>{if(m.p<T.length)throw new PE("SyntaxError","invalid syntax",n)};
  if(h.t==="i"&&h.v==="def"){if(!(T[1]&&T[1].t==="i"&&T[2]&&T[2].v==="("))throw new PE("SyntaxError","invalid syntax",n);let q=3;const ps=[];while(T[q]&&T[q].v!==")"){if(T[q].t==="i")ps.push(T[q].v);q++}
   if(!T[q])throw new PE("SyntaxError","'(' was never closed",n);if(!T[q+1]||T[q+1].v!==":")throw new PE("SyntaxError","expected ':'",n);F[T[1].v]={params:ps,start:i+1,ind:bodyInd(i)};return skip(i)}
  if(h.t==="i"&&h.v==="if"){let j=i,done=false;const ind=l.ind;
   while(true){const lj=L[j],tj=lj.T,isE=tj[0].v==="else";let c=true;
    if(isE){if(!(tj[1]&&tj[1].v===":"))throw new PE("SyntaxError","expected ':'",lj.n)}
    else{if(!done){const m=mk(tj,lj.n);m.p=1;c=m.expr();m.need(":");if(m.p<tj.length)throw new PE("SyntaxError","invalid syntax",lj.n)}else c=false}
    const bi=bodyInd(j),end=skip(j);if(!done&&c){execBlock(j+1,bi);done=true}
    j=end;if(!isE&&j<L.length&&L[j].ind===ind&&L[j].T[0].t==="i"&&(L[j].T[0].v==="elif"||L[j].T[0].v==="else"))continue;return j}}
  const m=mk(T,n);
  if(h.t==="i"&&h.v==="return"){m.p=1;const v=T.length>1?m.expr():null;throw new Ret(v)}
  if(h.t==="i"&&h.v==="print"&&T[1]&&T[1].v==="("){m.p=2;const a=m.args();m.need(")");endChk(m);const pos=a.filter(x=>!(x&&x.kw)),sep=a.find(x=>x&&x.kw==="sep");out.push(pos.map(fmt).join(sep?fmt(sep.v):" "));return i+1}
  if(h.t==="i"&&T[1]&&T[1].t==="o"&&T[1].v==="="){m.p=2;V[h.v]=m.expr();endChk(m);return i+1}
  m.expr();endChk(m);return i+1}
 if(L.length)execBlock(0,0);
 return out}
function grade(src){
 const clean=src.split("\n").map(cut).join("\n");
 if(!clean.trim())return{score:0,checks:[{ok:false,p:0,m:10,msg:"Code khali hai."}]};
 const runs=[[1,15,4],[2,15,4],[3,15,4],[4,15,4],[1,25,8],[2,25,8],[3,25,8],[4,25,8],[4,5,0],[9,5,3]],exp=[[19,11,60,3.75],[33,17,200,3.125]];
 const R=runs.map(r=>{try{return{o:runPy(src,r)}}catch(e){if(!(e instanceof PE))throw e;return{e}}});
 const E=e=>`${e.t} (line ${e.l}): ${e.m}`,isSyn=e=>e&&/Syntax|Indent|Unsupp/.test(e.t);
 const syn=(R.find(r=>isSyn(r.e))||{}).e,rt=(R.slice(0,8).find(r=>r.e&&!isSyn(r.e))||{}).e;
 const nums=o=>(o.join(" ").match(/-?\d+\.?\d*/g)||[]).map(Number),has=(r,v)=>r.o&&nums(r.o).some(x=>Math.abs(x-v)<1e-6);
 const C=[],add=(ok,pt,_,msg)=>C.push({ok,p:ok?pt:0,m:pt,msg});
 add(!syn,1,0,syn?"Syntax galti → "+E(syn):"Syntax theek hai");
 add(!syn&&!rt,1,0,syn?"Syntax ki wajah se chala nahi":rt?"Chalte waqt error → "+E(rt)+(rt.t==="TypeError"?" (input() string deta hai, int()/float() se convert karo)":""):"Bina error ke chalta hai");
 const hasDef=/\bdef\s+\w+\s*\(/.test(clean),called=!!(R[0].o&&R[0].o.length);
 add(hasDef&&called,1,0,!hasDef?"def se function nahi banaya":!called?"Function banaya lekin end mein call nahi kiya (calculator())":"Function bana kar call kiya");
 const conv=!syn&&!rt&&/\b(int|float)\s*\(/.test(clean);
 add(conv,1,0,conv?"int()/float() conversion kiya":"input ko int()/float() mein convert nahi kiya");
 const ife=/\bif\b/.test(clean)&&/\belse\b/.test(clean);
 add(ife,0.5,0,ife?"if/elif/else use kiya":"if/elif/else use nahi hua");
 ["Add (1)","Subtract (2)","Multiply (3)","Divide (4)"].forEach((nm,j)=>{const ok=has(R[j],exp[0][j])&&has(R[j+4],exp[1][j]);
  add(ok,1,0,ok?nm+" sahi":nm+" galat ya print nahi hua (15 aur 4 par "+exp[0][j]+" aana chahiye)")});
 const z=R[8],zok=!!(z.o&&/zero|error|undefined|cannot|invalid|not allowed/i.test(z.o.join(" ")));
 add(zok,1,0,zok?"Zero se divide handle kiya":z.e?"Zero se divide par crash → "+E(z.e):"Divide by zero par error message print nahi kiya");
 const v=R[9],vok=!!(v.o&&/invalid|wrong|error|incorrect/i.test(v.o.join(" ")));
 add(vok,0.5,0,vok?"Invalid operation handle kiya":"Galat operation (jaise 9) par 'Invalid operation!' print nahi hua");
 return{score:C.reduce((a,c)=>a+c.p,0),checks:C}}
// ---------- app ----------
const $=id=>document.getElementById(id),app=$("app"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const r1=n=>Math.round(n*10)/10,MAX=CFG.MAX,NQ=CFG.NQ;
let st=Object.assign({name:"",dev:Math.random().toString(36).slice(2,10)+Date.now().toString(36),attempts:0,best:null,locked:false,viol:0,active:false},JSON.parse(ls.g("zq3")||"{}"));
const save=()=>ls.s("zq3",JSON.stringify(st));save();
let IP="unknown",cur=null,msg="";
const ipP=fetch("https://api.ipify.org?format=json").then(r=>r.json()).then(j=>{IP=j.ip}).catch(()=>{});
const lastR=()=>JSON.parse(ls.g("zl3")||"null");
async function api(d){if(!CFG.API)return{ok:true,local:true};await ipP;try{const r=await fetch(CFG.API,{method:"POST",body:JSON.stringify({...d,name:st.name,dev:st.dev,ip:IP,ua:navigator.userAgent.slice(0,80)})});return await r.json()}catch(e){return null}}
async function sync(){const s=await api({event:"status"});if(s&&!s.local&&s.attempts!=null){st.attempts=s.attempts;st.best=s.best;st.viol=s.cheats;st.locked=s.attempts>=MAX;save()}}
function home(){
 const done=st.locked||st.attempts>=MAX,L=lastR();
 const nameBox=CFG.ROSTER.length?`<select id="nm" style="width:100%;padding:12px;border-radius:10px"><option value="">— apna naam chuno —</option>${CFG.ROSTER.map(n=>`<option>${esc(n)}</option>`).join("")}</select>`:'<input id="nm" placeholder="Poora naam">';
 app.innerHTML=msg+(st.name?`<div class="c"><b>Welcome back, ${esc(st.name)}! 👋</b><p class="tiny">Attempts: ${st.attempts}/${MAX}${st.best!=null?" · Best: "+st.best+"/20":""}</p>${done?'<p class="bad">Attempts khatam.</p>':'<button class="p" id="go">Test shuru karo (10 MCQ + calculator code)</button>'}${L?'<button id="rp">Pichla result + galtiyan dekho</button>':""}</div>`
 :`<div class="c"><p>Apna naam chuno/likho (sirf ek baar):</p>${nameBox}<button class="p" id="go">Save & Continue</button></div>`)
 +'<p class="tiny">⚠️ Test ke dauran screen/app/tab se bahar gaye ya reload kiya = attempt cancel. Code sirf type karna hai, paste nahi chalega. Aapka IP/device record hota hai.</p>';
 msg="";
 const g=$("go");if(g)g.onclick=async()=>{g.disabled=true;g.textContent="Loading…";
  if(!st.name){const n=$("nm").value.trim().replace(/\s+/g," ");if(n.length<2){g.disabled=false;g.textContent="Save & Continue";return alert("Naam likho")}st.name=n;save();await sync();home()}else start()};
 const r=$("rp");if(r)r.onclick=()=>report(L)}
async function start(){
 if(CFG.API===""&&st.attempts>=MAX)return home();
 const r=await api({event:"start"});
 if(r===null){msg='<div class="c bad">Internet/server ka masla. Dobara try karo (attempt use nahi hua).</div>';return home()}
 if(!r.ok){st.attempts=r.attempts;st.locked=true;save();msg='<div class="c bad">Attempts khatam.</div>';return home()}
 st.attempts=r.local?st.attempts+1:r.attempts;st.active=true;save();
 const qs=Q.map(q=>({q:q[0],r:q[1],o:q.slice(1).map((t,i)=>[t,i===0]).sort(()=>Math.random()-.5)})).sort(()=>Math.random()-.5).slice(0,NQ);
 cur={qs,i:0,sc:0,wrong:[],on:true};showQ()}
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
function showQ(){const x=cur.qs[cur.i];
 app.innerHTML=`<div class="c">${bar(cur.i/NQ*100)}<p class="tiny">Part A · Sawal ${cur.i+1}/${NQ} · Attempt ${st.attempts}/${MAX}</p><p id="qt" style="white-space:pre-wrap"></p>${x.o.map((o,k)=>`<button data-k="${k}"></button>`).join("")}</div>`;
